name: Release

# Manual only. Nothing publishes itself: you choose from the Actions tab what gets
# built and whether it becomes a release, a prerelease, a draft, or just artifacts
# attached to the run. The tag is created for you from the version in Cargo.toml.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'What to publish'
        type: choice
        default: prerelease
        options:
          - prerelease
          - release
          - artifacts only (no release, no tag)
      draft:
        description: 'Draft — nothing is public until you press Publish. Ignored for artifacts only.'
        type: boolean
        default: false
      platforms:
        description: 'Which platforms to build'
        type: choice
        default: both
        options:
          - both
          - macOS only
          - Windows only
      tag:
        description: 'Tag to use. Blank means v + the version in src-tauri/Cargo.toml.'
        type: string
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Resolves the tag and the build matrix, and refuses a tag that disagrees with the
  # manifests — otherwise a `v0.2.0` release would carry WhisperFree_0.1.0_*.
  # Cheap enough to fail in seconds rather than after two half-hour builds.
  resolve:
    name: Resolve
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      matrix: ${{ steps.plan.outputs.matrix }}
      publishing: ${{ steps.plan.outputs.publishing }}
      updating: ${{ steps.plan.outputs.updating }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        # Inputs go through the environment, never straight into the script: `tag` is
        # free text and would otherwise be an injection point.
        env:
          IN_TAG: ${{ inputs.tag }}
          IN_PUBLISH: ${{ inputs.publish }}
          IN_PLATFORMS: ${{ inputs.platforms }}
          IN_DRAFT: ${{ inputs.draft }}
          # The value never reaches the log — only whether one is set. Without
          # it the bundler emits no `.sig`, `tauri-action` skips latest.json,
          # and the release silently reaches nobody's installed copy.
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          # Same treatment, same reason: only whether one is set is ever logged.
          HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          set -euo pipefail

          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          pkg=$(jq -r .version package.json)
          if [ "$version" != "$pkg" ]; then
            echo "::error::src-tauri/Cargo.toml ($version) and package.json ($pkg) disagree"
            exit 1
          fi

          tag="${IN_TAG:-v$version}"
          if [ "${tag#v}" != "$version" ]; then
            echo "::error::tag $tag does not match version $version — bump the manifests or pick another tag"
            exit 1
          fi

          mac='{"platform":"macos-latest","target":"aarch64-apple-darwin"}'
          win='{"platform":"windows-latest","target":"x86_64-pc-windows-msvc"}'
          case "$IN_PLATFORMS" in
            "macOS only")   matrix="{\"include\":[$mac]}" ;;
            "Windows only") matrix="{\"include\":[$win]}" ;;
            *)              matrix="{\"include\":[$mac,$win]}" ;;
          esac

          publishing=true
          [ "$IN_PUBLISH" = "artifacts only (no release, no tag)" ] && publishing=false

          if [ "$publishing" = true ] && [ "$HAS_SIGNING_KEY" != true ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set — see docs/RELEASING.md"
            exit 1
          fi

          # An unsigned macOS build is not merely unsigned. Its designated requirement
          # is the cdhash of the executable and nothing else, so macOS keys the
          # Accessibility and Microphone grants to those exact bytes: shipping one
          # revokes both on every installed copy the moment it updates, while System
          # Settings goes on showing them granted and no in-app action can recover it.
          if [ "$publishing" = true ] && [ "$IN_PLATFORMS" != "Windows only" ] \
             && [ "$HAS_APPLE_CERT" != true ]; then
            echo "::error::APPLE_CERTIFICATE is not set — publishing macOS unsigned would strip users' permissions on update; see docs/RELEASING.md"
            exit 1
          fi

          # Only a published, non-draft, non-prerelease build reaches installed
          # copies: the updater endpoint is releases/latest/download/latest.json,
          # and GitHub resolves `latest` to neither a prerelease nor a draft.
          updating=false
          if [ "$publishing" = true ] && [ "$IN_PUBLISH" = release ] && [ "$IN_DRAFT" != true ]; then
            updating=true
          fi

          {
            echo "tag=$tag"
            echo "matrix=$matrix"
            echo "publishing=$publishing"
            echo "updating=$updating"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release plan"
            echo ""
            if [ "$publishing" = false ]; then
              echo "- **No release.** Bundles are attached to this run as workflow artifacts."
            else
              echo "- Tag \`$tag\` at \`${GITHUB_SHA:0:7}\` (created if it does not exist)"
              echo "- Published as **$IN_PUBLISH**$([ "$IN_DRAFT" = true ] && echo ', as a **draft**')"
            fi
            echo "- Version \`$version\`, platforms: $IN_PLATFORMS"
            if [ "$updating" = true ]; then
              echo "- **Existing installs will be offered this version.**"
            elif [ "$publishing" = true ]; then
              echo "- Existing installs are *not* offered this version — only a published, non-draft \`release\` becomes Latest."
            fi
            if [ "$publishing" = true ] && [ "$IN_PLATFORMS" != both ]; then
              echo ""
              echo "> ⚠️ Only one platform is being built, so the release will be missing the other."
              if [ "$updating" = true ]; then
                echo "> Its users will be told no update is published for their computer."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build (${{ matrix.platform }})
    needs: resolve
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Restores what it can and never writes: release builds run from whatever ref you
      # dispatched, and GitHub scopes caches by ref, so saving here mostly produces
      # entries nothing else can read. Cold builds are the norm — `lto = true` with
      # `codegen-units = 1` plus the ONNX Runtime `ort-sys` download means budget
      # ~20-30 min per platform.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: release-${{ matrix.target }}
          save-if: false

      # `beforeBuildCommand` is `bun run build`, and `tauri::generate_context!` will not
      # compile without ../dist on disk, so the frontend deps must be installed first.
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # `windows-core` is pinned to 0.61 in Cargo.lock only — cpal 0.18 stops compiling
      # on Windows if it floats to 0.62. --locked fails here, loudly, rather than
      # letting the bundle build against a silently updated lockfile.
      - name: Fetch dependencies (locked)
        working-directory: src-tauri
        run: cargo fetch --locked

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Update signing, which is not code signing: it is what the pubkey in
          # tauri.conf.json verifies, it needs no Apple or Authenticode
          # certificate, and without it `createUpdaterArtifacts` produces
          # bundles the installed app will refuse.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code signing, which is what gives the app an identity stable enough
          # for macOS to keep a permission grant attached to it across an update. The
          # CLI imports this .p12 into a throwaway keychain and infers the identity
          # from it, so APPLE_SIGNING_IDENTITY is not needed here; both are ignored by
          # the Windows job. Deliberately no APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID:
          # those are what send Tauri down the notarization path, which a self-signed
          # certificate cannot satisfy and which would fail the build.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          # An empty tagName makes the action build and skip every upload, which is the
          # "artifacts only" path.
          tagName: ${{ needs.resolve.outputs.publishing == 'true' && needs.resolve.outputs.tag || '' }}
          releaseName: ${{ needs.resolve.outputs.publishing == 'true' && format('WhisperFree {0}', needs.resolve.outputs.tag) || '' }}
          prerelease: ${{ inputs.publish == 'prerelease' }}
          releaseDraft: ${{ inputs.draft }}
          generateReleaseNotes: true
          # Written for every release, prerelease and draft included: the
          # manifest is an asset on that release, and only the one GitHub calls
          # Latest is ever fetched. Both matrix jobs write it, and the action
          # merges the platform it built into whatever is already there.
          uploadUpdaterJson: ${{ needs.resolve.outputs.publishing == 'true' }}
          uploadWorkflowArtifacts: ${{ needs.resolve.outputs.publishing != 'true' }}
          retryAttempts: 2
          releaseBody: |
            Both downloads are **unsigned**, so each platform will warn you once. Nothing
            below needs admin rights.

            ### macOS (Apple Silicon, macOS 13+)

            Open the `.dmg`, drag **WhisperFree** to Applications, then clear the
            quarantine flag:

            ```sh
            xattr -cr /Applications/WhisperFree.app
            ```

            Without that, macOS reports the app as damaged. Right-click → Open works too.

            `WhisperFree.app.tar.gz` is the same app without the disk-image wrapper,
            if you would rather unpack it yourself.

            On first use the app asks for **Microphone** (to record) and **Accessibility**
            (to paste into the app you are typing in), both in
            System Settings › Privacy & Security.

            ### Windows (64-bit, Windows 10/11)

            Run the `-setup.exe`. SmartScreen will block it: **More info** → **Run anyway**.
            It installs for the current user only.

            ### First launch

            WhisperFree has no Dock icon — it lives in the menu bar or the notification
            area. The ~671 MB speech model is **not** bundled; download it from
            Settings › Models before your first dictation. The installer being small is
            expected.

            ### Updates

            From this version on, WhisperFree can update itself: Settings › Updates has a
            **Check now** button, and an optional daily check that is off until you switch
            it on. An update installed that way needs no `xattr -cr` — that step is only
            for a fresh download from this page.

  # `tauri-action` writes latest.json by reading the copy already attached to
  # the release, merging in the platform it just built, and re-uploading it.
  # Two matrix jobs doing that concurrently can have both read before either
  # writes, and the loser's platform disappears — the same family of race as
  # the find-or-create one in docs/RELEASING.md, and just as unlikely. It is
  # silent, though: users on the lost platform are simply told no update is
  # published for their computer. So it is checked rather than hoped for.
  verify:
    name: Verify updater manifest
    needs: [resolve, build]
    if: needs.resolve.outputs.publishing == 'true' && inputs.platforms == 'both'
    runs-on: ubuntu-latest
    permissions:
      # Read-only work, but GitHub only lists draft releases to a token with
      # push access — and a draft is exactly when checking before publishing is
      # worth something.
      contents: write
    steps:
      - name: Check latest.json lists both platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          # Not `gh release download`: that resolves a tag through an endpoint
          # which does not return drafts, so it 404s on exactly the runs worth
          # checking. Listing and filtering sees published and draft alike.
          gh api "repos/$GH_REPO/releases?per_page=100" > releases.json
          asset=$(jq -r --arg tag "$TAG" '
            [.[] | select(.tag_name == $tag)][0].assets[]?
            | select(.name == "latest.json") | .id
          ' releases.json)

          if [ -z "$asset" ]; then
            echo "::error::no latest.json on $TAG — the signing key or createUpdaterArtifacts is not doing its job"
            exit 1
          fi

          gh api "repos/$GH_REPO/releases/assets/$asset" \
            -H "Accept: application/octet-stream" > latest.json

          missing=()
          for platform in darwin-aarch64 windows-x86_64; do
            # Explicitly non-empty: in jq an empty string is truthy, so a
            # bare `.url and .signature` would pass a manifest carrying both
            # keys and neither value.
            jq -e --arg p "$platform" '
              (.platforms[$p].url // "") != "" and (.platforms[$p].signature // "") != ""
            ' latest.json > /dev/null || missing+=("$platform")
          done

          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::latest.json is missing ${missing[*]} — re-run the build job for that platform"
            exit 1
          fi

          echo "latest.json advertises $(jq -r .version latest.json) for both platforms" \
            >> "$GITHUB_STEP_SUMMARY"
