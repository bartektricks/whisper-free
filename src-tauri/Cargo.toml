[package]
name = "local-dictation"
version = "0.1.0"
description = "Fully local dictation"
authors = ["Bartlomiej Ciszewski"]
edition = "2021"
license = "MIT"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name.
# See https://github.com/rust-lang/cargo/issues/8519
name = "local_dictation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what makes a transparent window legal on macOS, and a
# transparent window is what gives the dictation overlay rounded corners. The
# Tauri CLI would infer the feature from `macOSPrivateApi` in tauri.conf.json,
# but CI runs `cargo clippy` directly, so it is spelled out here to keep the two
# builds identical. See docs/decisions/0004-dictation-overlay.md.
tauri = { version = "2", features = [
    "tray-icon",
    "image-png",
    "macos-private-api",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
cpal = "0.18.1"
rubato = "5.0.0"
ureq = "3.4.0"
sha2 = "0.11.0"

# Official plugins. Everything here is driven from Rust, so only the `os`
# plugin — whose `platform()` is called from Svelte — needs a capability entry.
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-os = "2.3.2"
tauri-plugin-single-instance = "2.4.3"

# The execution provider is a runtime setting (decision 0001), so CoreML stays
# available on macOS even though the app asks for CPU. Elsewhere there is no
# CoreML to enable.
[target.'cfg(target_os = "macos")'.dependencies]
transcribe-rs = { version = "0.3.11", features = ["onnx", "ort-coreml"] }
core-graphics = "0.25.0"

# Accessibility, for asking macOS which window has keyboard focus so the
# overlay appears on the display the user is working on
# (`platform/macos/focus.rs`). Both are already in the tree via core-graphics
# and tao, so the versions are pinned to match rather than to add a second copy.
core-foundation = "0.10.1"

# Two things Tauri does not expose: the overlay's window level and Spaces
# behaviour (`platform/macos/window.rs`), and the launch activation settled in
# `platform/macos/mod.rs`. Both are already in the tree via tao, so the versions
# are pinned to match rather than to pull in a second copy. `objc2` itself is
# here only for `MainThreadMarker`.
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSResponder",
    "NSWindow",
] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
transcribe-rs = { version = "0.3.11", features = ["onnx"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS:
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
